<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>
    <div class="page">
        <header class="header">
            <img class="header__logo" src="../images/icons/photo.jpg" alt="Логотип">
            <h1 class="header__text">Фамилия Георгий Батькович</h1>
        </header>
        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a class="nav__link" href="../index.html">Главная</a></li>
                <li class="nav__item"><a class="nav__link" href="projects.html">Проекты</a></li>
                <li class="nav__item"><a class="nav__link" href="diary.html">Дневник</a></li>
                <li class="nav__item"><a class="nav__link nav__link--active" href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
        <section class="section">
            <h2 class="section__contacts_title">Свяжитесь со мной</h2>
            <div class="section__contacts-forma">
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label class="form-label" for="name">Имя:</label>
                        <input class="form-input" type="text" id="name" name="name" required
                            placeholder="Введите ваше имя">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email:</label>
                        <input class="form-input" type="email" id="email" name="email" required
                            placeholder="Введите ваш email">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">Сообщение:</label>
                        <textarea class="form-textarea" id="message" name="message" required
                            placeholder="Введите ваше сообщение"></textarea>
                    </div>
                    <button type="submit" class="form-submit">Отправить сообщение</button>
                </form>
            </div>
            <div class="contacts">
                <h2>Контакты:</h2>
                <div class="contact-item">
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                    </svg>
                    <p class="contact-text">email_my@mail.ru</p>
                </div>
                <div class="contact-item">
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                    </svg>
                    <p class="contact-text">Github: zhorikbla</p>
                </div>
                <div class="contact-item">
                    <svg class="contact-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
                    </svg>
                    <p class="contact-text">Город, Страна</p>
                </div>
            </div>
        </section>
        <footer class="footer">
            <p>© 2025 Все права защищены.</p>
        </footer>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };
            const contactData = formData;
            console.log('Данные формы:', contactData);
            alert('Сообщение отправлено! Данные сохранены.\n\nИмя: ' + contactData.name + '\nEmail: ' + contactData.email + '\nСообщение: ' + contactData.message);
            this.reset();
        });
    </script>
</body>

</html>
